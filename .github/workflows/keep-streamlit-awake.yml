name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Streamlit app
        run: |
          curl -L --retry 3 --retry-delay 10 --max-time 60 https://ai-architecture-designer.streamlit.app
